<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什麼？命運轉盤</title>
<style>
  :root{
    --bg:#fff8f0; --card:#ffffff; --text:#2d2a26; --muted:#7a716a; --line:#eee3d8;
    --accent:#ff7a45; --accent2:#ffb347; --good:#2ea86b; --shadow:0 6px 20px rgba(120,80,40,.12);
  }
  [data-theme="dark"]{
    --bg:#1d1b19; --card:#2a2724; --text:#f3ece4; --muted:#b0a69c; --line:#3d3934;
    --accent:#ff8a5c; --accent2:#ffc069; --shadow:0 6px 20px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
       background:var(--bg);color:var(--text);transition:background .3s,color .3s}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;max-width:1100px;margin:auto}
  header h1{font-size:1.4rem;margin:0}
  header h1 span{color:var(--accent)}
  .icon-btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;
            padding:8px 14px;cursor:pointer;font-size:.95rem}
  main{max-width:1100px;margin:auto;padding:0 16px 40px;display:grid;grid-template-columns:1.1fr 1fr;gap:20px}
  @media (max-width:860px){main{grid-template-columns:1fr}}
  .card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:18px}
  .card h2{font-size:1.05rem;margin:0 0 12px}
  /* 轉盤 */
  .wheel-wrap{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:1}
  #wheel{width:100%;height:100%;display:block}
  .pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
           border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--accent);
           filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:2}
  .pointer.bump{animation:bump .12s}
  @keyframes bump{50%{transform:translateX(-50%) rotate(-12deg)}}
  #spinBtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:23%;aspect-ratio:1;border-radius:50%;
           border:4px solid #fff;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;
           font-size:clamp(.9rem,3vw,1.2rem);font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:2}
  #spinBtn:disabled{filter:grayscale(.5);cursor:not-allowed}
  .result{text-align:center;font-size:1.1rem;min-height:1.6em;margin-top:6px}
  .result b{color:var(--accent);font-size:1.4rem}
  /* 控制項 */
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
  .chip{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.9rem}
  .stars{cursor:pointer;user-select:none;color:var(--accent2);white-space:nowrap}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  label.small{font-size:.9rem;color:var(--muted)}
  input[type=text],input[type=number],select{border:1px solid var(--line);background:var(--bg);color:var(--text);
           border-radius:10px;padding:8px 10px;font-size:.95rem;min-width:0}
  input[type=range]{accent-color:var(--accent);flex:1}
  .btn{border:none;background:var(--accent);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:.95rem}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .list{list-style:none;padding:0;margin:10px 0 0;max-height:300px;overflow:auto}
  .list li{display:grid;grid-template-columns:14px 1fr auto auto auto;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px dashed var(--line)}
  .list li.off{opacity:.35}
  .dot{width:12px;height:12px;border-radius:50%}
  .tag{font-size:.75rem;color:var(--muted);white-space:nowrap}
  .del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem}
  .history li{grid-template-columns:1fr auto}
  .stat-bar{height:8px;border-radius:4px;background:var(--accent2)}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .empty{color:var(--muted);text-align:center;padding:16px}
  /* 結果彈窗 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:10;padding:16px}
  .modal.show{display:flex}
  .modal-box{background:var(--card);border-radius:20px;padding:28px 24px;text-align:center;max-width:360px;width:100%;animation:pop .35s ease}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .modal-box .emoji{font-size:3.2rem}
  .modal-box h3{font-size:1.8rem;margin:8px 0;color:var(--accent)}
  .modal-box p{color:var(--muted);margin:4px 0 18px}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:11}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);
         padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .3s;z-index:12;font-size:.9rem}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>🍱 今天<span>吃什麼</span>？</h1>
  <div class="row">
    <button class="icon-btn" id="soundBtn" title="音效開關">🔊</button>
    <button class="icon-btn" id="themeBtn" title="深色模式">🌙</button>
  </div>
</header>

<main>
  <!-- 左：轉盤 -->
  <section class="card">
    <div class="wheel-wrap">
      <div class="pointer" id="pointer"></div>
      <canvas id="wheel" width="880" height="880"></canvas>
      <button id="spinBtn">轉！</button>
    </div>
    <div class="result" id="resultText">按下中間的按鈕，讓命運決定 🎲</div>
  </section>

  <!-- 右：設定 -->
  <section class="card">
    <div class="tabs">
      <button class="chip on" data-tab="filter">🎯 篩選</button>
      <button class="chip" data-tab="menu">📝 選項管理</button>
      <button class="chip" data-tab="history">📊 紀錄</button>
    </div>

    <!-- 篩選 -->
    <div data-panel="filter">
      <h2>想吃哪一類？</h2>
      <div class="chips" id="catChips"></div>
      <h2 style="margin-top:16px">轉盤規則</h2>
      <label class="row small"><input type="checkbox" id="noRepeat"> 不要跟上一次抽到一樣的</label>
      <label class="row small" style="margin-top:6px"><input type="checkbox" id="useWeight" checked> 依照「喜好度 ★」調整中獎機率</label>
      <h2 style="margin-top:16px">快速套用清單</h2>
      <div class="row">
        <button class="btn ghost" data-preset="lunch">☀️ 午餐</button>
        <button class="btn ghost" data-preset="night">🌙 宵夜</button>
        <button class="btn ghost" data-preset="drink">🧋 飲料</button>
      </div>
    </div>

    <!-- 選項管理 -->
    <div data-panel="menu" hidden>
      <h2>新增選項</h2>
      <form id="addForm" class="row">
        <input type="text" id="newName" placeholder="例如：咖哩飯" maxlength="12" style="flex:1 1 160px" required>
        <select id="newCat"></select>
        <button class="btn" type="submit">＋</button>
      </form>
      <ul class="list" id="optList"></ul>
      <div class="row" style="margin-top:10px;justify-content:space-between">
        <span class="tag">點星星可調整喜好度（1～5）</span>
        <button class="btn ghost" id="resetBtn">↺ 還原預設</button>
      </div>
    </div>

    <!-- 紀錄 -->
    <div data-panel="history" hidden>
      <h2>最近 10 次結果</h2>
      <ul class="list history" id="histList"></ul>
      <h2 style="margin-top:16px">抽中次數統計</h2>
      <div id="stats"></div>
      <div class="row" style="margin-top:10px;justify-content:flex-end">
        <button class="btn ghost" id="clearHist">🗑 清除紀錄</button>
      </div>
    </div>
  </section>
</main>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="emoji" id="mEmoji">🎉</div>
    <div>今天就吃</div>
    <h3 id="mName"></h3>
    <p id="mInfo"></p>
    <div class="row" style="justify-content:center">
      <button class="btn ghost" id="againBtn">🔄 不滿意，再轉一次</button>
      <button class="btn" id="okBtn">👍 就決定是你了</button>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script>
/* ========== 資料 ========== */
const CATS = {rice:{n:"飯類",e:"🍚"}, noodle:{n:"麵類",e:"🍜"}, light:{n:"輕食",e:"🥗"}, fast:{n:"速食",e:"🍔"}, drink:{n:"飲料",e:"🧋"}, snack:{n:"小吃",e:"🍢"}};
const COLORS = ["#ff7a45","#ffb347","#ffd166","#06d6a0","#4cc9f0","#7b8cde","#c77dff","#f78fb3","#90be6d","#f9844a"];
const PRESETS = {
  lunch:[["滷肉飯","rice"],["牛肉麵","noodle"],["咖哩飯","rice"],["義大利麵","noodle"],["雞腿便當","rice"],["拉麵","noodle"],["沙拉碗","light"],["漢堡套餐","fast"],["水餃","snack"],["火鍋","rice"]],
  night:[["鹹酥雞","snack"],["炒泡麵","noodle"],["燒烤","snack"],["清粥小菜","rice"],["麻辣燙","noodle"],["蔥抓餅","snack"],["炸雞","fast"]],
  drink:[["珍珠奶茶","drink"],["鮮奶茶","drink"],["水果茶","drink"],["美式咖啡","drink"],["豆花","snack"],["檸檬綠","drink"]]
};
const mk = (arr) => arr.map(([name,cat],i)=>({id:Date.now()+i+Math.random(),name,cat,w:3}));

const store = {
  get(k,d){try{const v=localStorage.getItem("wte_"+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem("wte_"+k,JSON.stringify(v))}catch(e){}}
};
let state = {
  options: store.get("options", mk(PRESETS.lunch)),
  cats: store.get("cats", Object.keys(CATS)),
  noRepeat: store.get("noRepeat", true),
  useWeight: store.get("useWeight", true),
  history: store.get("history", []),
  sound: store.get("sound", true),
  theme: store.get("theme", window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
};
const save = () => ["options","cats","noRepeat","useWeight","history","sound","theme"].forEach(k=>store.set(k,state[k]));

/* ========== DOM ========== */
const $ = s => document.querySelector(s);
const canvas = $("#wheel"), ctx = canvas.getContext("2d");
let rotation = 0, spinning = false, lastTickSeg = -1;

function active(){
  return state.options.filter(o => state.cats.includes(o.cat));
}

function weightOf(o){ return state.useWeight ? (o.w||3) : 1; }

/* ========== 畫轉盤 ========== */
function segments(){
  const list = active(), total = list.reduce((s,o)=>s+weightOf(o),0);
  let a = 0;
  return list.map((o,i)=>{ const span = weightOf(o)/total*Math.PI*2; const seg={o,start:a,end:a+span,color:colorOf(o)}; a+=span; return seg; });
}
function colorOf(o){ return COLORS[state.options.indexOf(o) % COLORS.length]; }

function drawWheel(){
  const W = canvas.width, R = W/2 - 10, c = W/2;
  ctx.clearRect(0,0,W,W);
  const segs = segments();
  ctx.save(); ctx.translate(c,c); ctx.rotate(rotation);
  if(!segs.length){
    ctx.fillStyle = "#ccc"; ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#fff"; ctx.font="bold 40px sans-serif"; ctx.textAlign="center";
    ctx.fillText("沒有符合條件的選項 😢",0,-R/2);
  }
  segs.forEach(s=>{
    ctx.beginPath(); ctx.moveTo(0,0);
    ctx.arc(0,0,R,s.start-Math.PI/2,s.end-Math.PI/2); ctx.closePath();
    ctx.fillStyle = s.color; ctx.fill();
    ctx.strokeStyle="#fff"; ctx.lineWidth=4; ctx.stroke();
    // 文字
    const mid = (s.start+s.end)/2 - Math.PI/2;
    ctx.save(); ctx.rotate(mid);
    ctx.textBaseline="middle"; ctx.fillStyle="#fff";
    const span = s.end - s.start;
    const size = Math.max(18, Math.min(42, span*R*0.35));
    ctx.font = `bold ${size}px "Noto Sans TC","Microsoft JhengHei",sans-serif`;
    ctx.shadowColor="rgba(0,0,0,.35)"; ctx.shadowBlur=4;
    // v2 修正：左半邊的字會上下顛倒 → 實際角度落在左半圓時把文字轉 180° 再畫
    const screenAng = (((mid + rotation) % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
    const flip = screenAng > Math.PI/2 && screenAng < Math.PI*1.5;
    const label = s.o.name + " " + CATS[s.o.cat].e;
    if(flip){ ctx.rotate(Math.PI); ctx.textAlign="left"; ctx.fillText(label, -(R-24), 0); }
    else { ctx.textAlign="right"; ctx.fillText(CATS[s.o.cat].e + " " + s.o.name, R-24, 0); }
    ctx.restore();
  });
  ctx.restore();
  // 外框
  ctx.beginPath(); ctx.arc(c,c,R,0,Math.PI*2); ctx.lineWidth=12; ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.stroke();
  $("#spinBtn").disabled = spinning || segs.length < 2;
}

/* 指針（正上方）目前指到哪一格 */
function segAtPointer(segs){
  const a = ((-rotation) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  return segs.findIndex(s => a >= s.start && a < s.end);
}

/* ========== 抽選 & 旋轉 ========== */
function pickTarget(segs){
  let pool = segs;
  const last = state.history[0]?.name;
  if(state.noRepeat && segs.length > 1) pool = segs.filter(s => s.o.name !== last);
  const total = pool.reduce((s,x)=>s+(x.end-x.start),0);
  let r = Math.random()*total;
  for(const s of pool){ r -= (s.end-s.start); if(r<=0) return s; }
  return pool[pool.length-1];
}

function spin(){
  const segs = segments();
  if(spinning || segs.length < 2) return;
  closeModal();
  spinning = true; drawWheel();
  $("#resultText").textContent = "轉呀轉～ 🌀";
  const target = pickTarget(segs);
  const span = target.end - target.start;
  const t = target.start + span*(0.15 + Math.random()*0.7);          // 落點：格子內隨機位置（避開邊界）
  const TAU = Math.PI*2;
  const delta = (((-t - rotation) % TAU) + TAU) % TAU;
  const from = rotation, to = rotation + TAU*(5 + Math.floor(Math.random()*3)) + delta;
  const dur = 4200 + Math.random()*800, t0 = performance.now();
  const ease = x => 1 - Math.pow(1-x, 4);
  function frame(now){
    const p = Math.min(1,(now-t0)/dur);
    rotation = from + (to-from)*ease(p);
    drawWheel();
    const idx = segAtPointer(segs);
    if(idx !== lastTickSeg){ lastTickSeg = idx; tick(); }
    if(p < 1) requestAnimationFrame(frame);
    else { rotation = to % TAU; spinning = false; drawWheel(); finish(target.o); }
  }
  requestAnimationFrame(frame);
}

function finish(o){
  state.history.unshift({name:o.name, cat:o.cat, time:Date.now()});
  state.history = state.history.slice(0,50);
  save(); renderHistory();
  $("#resultText").innerHTML = `結果：<b>${esc(o.name)}</b>`;
  $("#mEmoji").textContent = CATS[o.cat].e;
  $("#mName").textContent = o.name;
  $("#mInfo").textContent = `${CATS[o.cat].n}・喜好度 ${"★".repeat(o.w||3)}`;
  $("#modal").classList.add("show");
  fanfare(); confetti();
}
function closeModal(){ $("#modal").classList.remove("show"); }

/* ========== 音效（Web Audio，不需外部檔案） ========== */
let actx;
function beep(freq, dur, type="square", vol=.05){
  if(!state.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type=type; o.frequency.value=freq; g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function tick(){
  beep(900,.04);
  const p = $("#pointer"); p.classList.remove("bump"); void p.offsetWidth; p.classList.add("bump");
}
function fanfare(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.18,"triangle",.08),i*110)); }

/* ========== 彩帶 ========== */
const cf = $("#confetti"), cfx = cf.getContext("2d");
function confetti(){
  cf.width = innerWidth; cf.height = innerHeight;
  const ps = Array.from({length:140},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*16,vy:Math.random()*-16-4,
    s:6+Math.random()*6,c:COLORS[Math.floor(Math.random()*COLORS.length)],r:Math.random()*6,vr:(Math.random()-.5)*.3}));
  let n = 0;
  (function loop(){
    cfx.clearRect(0,0,cf.width,cf.height);
    ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.r+=p.vr;
      cfx.save();cfx.translate(p.x,p.y);cfx.rotate(p.r);cfx.fillStyle=p.c;cfx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cfx.restore();});
    if(++n < 140) requestAnimationFrame(loop); else cfx.clearRect(0,0,cf.width,cf.height);
  })();
}

/* ========== 介面渲染 ========== */
const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast.h); toast.h=setTimeout(()=>t.classList.remove("show"),1800); }

function renderFilters(){
  $("#catChips").innerHTML = Object.entries(CATS).map(([k,v])=>
    `<button class="chip ${state.cats.includes(k)?"on":""}" data-cat="${k}">${v.e} ${v.n}</button>`).join("");
  $("#noRepeat").checked = state.noRepeat;
  $("#useWeight").checked = state.useWeight;
  $("#newCat").innerHTML = Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v.e} ${v.n}</option>`).join("");
}

function renderOptions(){
  const act = active();
  $("#optList").innerHTML = state.options.length ? state.options.map(o=>`
    <li class="${act.includes(o)?"":"off"}" title="${act.includes(o)?"":"不符合目前的篩選條件"}">
      <span class="dot" style="background:${colorOf(o)}"></span>
      <span>${esc(o.name)}</span>
      <span class="tag">${CATS[o.cat].e} ${CATS[o.cat].n}</span>
      <span class="stars" data-star="${o.id}">${"★".repeat(o.w||3)}${"☆".repeat(5-(o.w||3))}</span>
      <button class="del" data-del="${o.id}" title="刪除">✕</button>
    </li>`).join("") : `<li class="empty" style="display:block">還沒有任何選項，先新增一個吧！</li>`;
}

function renderHistory(){
  const h = state.history.slice(0,10);
  $("#histList").innerHTML = h.length ? h.map(x=>`<li><span>${CATS[x.cat]?.e||"🍽"} ${esc(x.name)}</span>
     <span class="tag">${new Date(x.time).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</span></li>`).join("")
     : `<li class="empty" style="display:block">還沒有紀錄，去轉一次吧！</li>`;
  const cnt = {}; state.history.forEach(x=>cnt[x.name]=(cnt[x.name]||0)+1);
  const top = Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5), max = top[0]?.[1]||1;
  $("#stats").innerHTML = top.length ? top.map(([n,c])=>`
    <div style="margin:6px 0"><div class="row" style="justify-content:space-between"><span>${esc(n)}</span><span class="tag">${c} 次</span></div>
    <div class="stat-bar" style="width:${c/max*100}%"></div></div>`).join("") : `<div class="empty">尚無資料</div>`;
}

function refresh(){ save(); drawWheel(); renderOptions(); }
function applyTheme(){
  document.documentElement.dataset.theme = state.theme;
  $("#themeBtn").textContent = state.theme==="dark" ? "☀️" : "🌙";
  $("#soundBtn").textContent = state.sound ? "🔊" : "🔇";
}

/* ========== 事件 ========== */
$("#spinBtn").onclick = spin;
$("#againBtn").onclick = () => { closeModal(); setTimeout(spin,200); };
$("#okBtn").onclick = () => { closeModal(); toast("祝你用餐愉快 😋"); };
$("#modal").onclick = e => { if(e.target.id==="modal") closeModal(); };
document.addEventListener("keydown", e=>{
  if(e.code==="Space" && !["INPUT","SELECT","TEXTAREA","BUTTON"].includes(document.activeElement.tagName)){ e.preventDefault(); spin(); }
  if(e.key==="Escape") closeModal();
});

document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll("[data-panel]").forEach(p=>p.hidden = p.dataset.panel!==b.dataset.tab);
});

$("#catChips").onclick = e=>{
  const k = e.target.closest("[data-cat]")?.dataset.cat; if(!k || spinning) return;
  state.cats = state.cats.includes(k) ? state.cats.filter(x=>x!==k) : [...state.cats,k];
  renderFilters(); refresh();
};
$("#noRepeat").onchange = e=>{ state.noRepeat=e.target.checked; save(); };
$("#useWeight").onchange = e=>{ if(spinning){e.target.checked=state.useWeight;return;} state.useWeight=e.target.checked; refresh(); };

document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{
  if(spinning) return;
  state.options = mk(PRESETS[b.dataset.preset]);
  state.cats = Object.keys(CATS);
  renderFilters(); refresh(); toast(`已套用「${b.textContent.trim()}」清單`);
});

$("#addForm").onsubmit = e=>{
  e.preventDefault();
  if(spinning) return;
  const name = $("#newName").value.trim(), cat = $("#newCat").value;
  if(!name) return;
  if(state.options.some(o=>o.name===name)){ toast("這個選項已經在清單裡囉"); return; }
  if(state.options.length >= 16){ toast("最多 16 個選項，轉盤才看得清楚喔"); return; }
  state.options.push({id:Date.now()+Math.random(),name,cat,w:3});
  $("#newName").value=""; $("#newName").focus();
  refresh();
  if(!active().some(o=>o.name===name)) toast("已新增，但它不符合目前的篩選條件");
  else toast(`已新增「${name}」`);
};
$("#optList").onclick = e=>{
  if(spinning) return;
  const del = e.target.closest("[data-del]"), star = e.target.closest("[data-star]");
  if(del){ state.options = state.options.filter(o=>String(o.id)!==del.dataset.del); refresh(); }
  if(star){ const o = state.options.find(o=>String(o.id)===star.dataset.star); o.w = (o.w||3) % 5 + 1; refresh(); }
};
$("#resetBtn").onclick = ()=>{ if(spinning) return; if(confirm("確定要還原成預設的午餐清單嗎？")){ state.options = mk(PRESETS.lunch); refresh(); } };
$("#clearHist").onclick = ()=>{ if(confirm("確定清除所有紀錄？")){ state.history=[]; save(); renderHistory(); } };
$("#themeBtn").onclick = ()=>{ state.theme = state.theme==="dark"?"light":"dark"; applyTheme(); save(); };
$("#soundBtn").onclick = ()=>{ state.sound = !state.sound; applyTheme(); save(); toast(state.sound?"音效已開啟":"音效已關閉"); };

/* ========== 啟動 ========== */
applyTheme(); renderFilters(); renderOptions(); renderHistory(); drawWheel();
</script>
</body>
</html>
